name: CI — Vértice Workspace (Fixtures e Navegador)

# Este workflow valida tipos TypeScript, testes unitários/integração por fixtures,
# portabilidade Windows/Linux do proxy e suíte Playwright contra fixtures do AionCore v0.2.2.
# Testes com AionCore v0.2.2 real e CLIs autenticados (codex, antigravity, cursor-agent) são
# validação exclusivamente local (sem credenciais ou binários no CI).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Verificar tipos TypeScript
        run: npm run lint

      - name: Gerar build estático (dist/)
        run: npm run build

      - name: Executar testes unitários e de proxy/servidor local (fixtures)
        run: npm test

      - name: Diagnosticar servidor local reproduzível
        run: npm run server:doctor

  e2e-browser:
    name: Playwright E2E (Chromium headless · Fixtures AionCore)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Gerar build estático (dist/)
        run: npm run build

      - name: Executar suíte E2E
        run: npm run test:e2e

      - name: Limpar artefatos temporários
        if: always()
        run: npm run clean
